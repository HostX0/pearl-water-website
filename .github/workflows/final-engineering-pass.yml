name: Pearl Final Engineering Pass

on:
  push:
    branches: [main]
    paths:
      - 'scripts/final-engineering-pass.mjs'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final engineering pass
        run: node scripts/final-engineering-pass.mjs

      - name: Production build
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: finalize Pearl performance and accessibility"
          git push
