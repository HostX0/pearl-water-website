name: Pearl Website CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pearl-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_PROJECT_ID: prj_OoRDdJ65yDSD9Dx8Jvcv268acyF2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production app
        run: npm run build

  deploy:
    name: Deploy prebuilt production
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not configured; production deploy skipped."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.credentials.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund

      - name: Verify Vercel project access
        if: steps.credentials.outputs.enabled == 'true'
        shell: bash
        run: |
          http_code=$(curl --silent --show-error --output /tmp/vercel-project.json --write-out '%{http_code}' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN")
          if [ "$http_code" != "200" ]; then
            echo "Vercel project access failed with HTTP $http_code"
            cat /tmp/vercel-project.json
            exit 1
          fi
          echo "Vercel project access verified."

      - name: Build Vercel output on GitHub
        if: steps.credentials.outputs.enabled == 'true'
        run: npx --yes vercel@latest build --prod --yes --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production output
        if: steps.credentials.outputs.enabled == 'true'
        run: npx --yes vercel@latest deploy --prebuilt --prod --archive=tgz --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"
